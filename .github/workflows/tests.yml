name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[excel]"
      - run: python -m unittest discover -s tests -v
      - run: csv-doctor apply examples/broken.csv --recipe examples/recipe.json --output output
      - run: python output/replay.py examples/broken.csv replayed
      - run: diff output/clean.csv replayed/clean.csv
